[project]
name = "bp-perkwatch"
version = "0.1.0"
description = "Local AI perk monitor: collect, dedupe, LLM-extract, verify against official domains, deliver a daily email with a Markdown attachment"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "aczidongji" }]
dependencies = [
    "feedparser>=6.0,<7",
    "trafilatura>=2.0,<3",
    "lxml>=5.2",
    "tld>=0.13",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "tenacity>=9.0",
    "chinesecalendar>=1.9",
]

[project.urls]
Homepage = "https://github.com/aczidongji/bp-perkwatch"
Repository = "https://github.com/aczidongji/bp-perkwatch"
Issues = "https://github.com/aczidongji/bp-perkwatch/issues"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov"]

[project.scripts]
bp = "bp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
